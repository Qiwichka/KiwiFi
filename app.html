<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KiwiFi</title>
<meta name="theme-color" content="#1F1E1D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="assets/css/app.css">

<script>
/* Ловушка для срывов на старте. Ставится раньше всех остальных скриптов,
   потому что без бандлера и sourcemap это единственная отладка, которая
   есть: провалившийся import убивает модуль молча, и без этого на экране
   останется просто пустота без единой строчки в консоли.
   Взято из Qiwigram, там этот приём себя оправдал. */
(function () {
    var steps = []
    window.kiwiStep = function (m) {
        steps.push(m)
        if (location.hostname === "localhost" || location.hostname === "127.0.0.1") {
            try { navigator.sendBeacon("/__log?m=" + encodeURIComponent(m)) } catch (e) {}
        }
    }
    window.kiwiBootError = null
    window.addEventListener("error", function (e) {
        window.kiwiBootError = (e.message || "ошибка") + " @ " + (e.filename || "?") + ":" + (e.lineno || 0)
        kiwiStep("СРЫВ: " + window.kiwiBootError)
    })
    window.addEventListener("unhandledrejection", function (e) {
        window.kiwiBootError = "промис: " + (e.reason && e.reason.message || e.reason)
        kiwiStep("СРЫВ: " + window.kiwiBootError)
    })
    setTimeout(function () {
        if (window.kiwiReady) return
        var d = document.createElement("div")
        d.style.cssText = "position:fixed;inset:auto 16px 16px 16px;z-index:99;padding:16px 18px;" +
            "background:#2a1a17;border:1px solid #CF6558;border-radius:14px;color:#F2C0B8;" +
            "font:13px/1.5 ui-monospace,monospace;white-space:pre-wrap"
        d.textContent = "Приложение не запустилось за 10 секунд.\n\n" +
            (window.kiwiBootError ? window.kiwiBootError + "\n\n" : "") +
            "Пройденные шаги:\n" + steps.join("\n")
        document.body.appendChild(d)
    }, 10000)
})()
</script>
</head>
<body>

<!-- Живой фон, сцена «луг»: небо с облаками и поле травы под ним — та же
     связка, что на saittest. Канвасы создаются по разу на всё приложение:
     WebGL-контекстов у браузера считанные единицы, дальше он молча убивает
     самые старые. Вуаль .bg__scrim поверх обязательна — небо яркое, без
     затемнения белый текст на облаках просто пропадёт. -->
<div class="bg" id="bg">
    <canvas class="bg__layer bg__sky" id="bg-sky"></canvas>
    <canvas class="bg__layer bg__grass" id="bg-grass"></canvas>
    <canvas class="bg__layer bg__reflect" id="bg-reflect" hidden></canvas>
    <div class="bg__scrim"></div>
</div>

<div class="app">

    <!-- ══ Боковая колонка ══════════════════════════════════════════ -->
    <aside class="side panel">
        <button class="side__brand" data-go="home">
            <svg viewBox="0 0 24 24" fill="none" stroke="#D97757" stroke-width="1.9"
                 stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 18V5l10-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/>
            </svg>
            KiwiFi
        </button>

        <nav class="side__nav" id="nav">
            <button class="navlink" data-go="home">
                <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 9.5V20h14V9.5"/></svg>
                Главная
            </button>
            <button class="navlink" data-go="search">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
                Поиск
            </button>
            <button class="navlink" data-go="library">
                <svg viewBox="0 0 24 24"><path d="M4 19V5M9 19V5M14 6l5 13"/></svg>
                Библиотека
            </button>
            <button class="navlink" data-go="queue">
                <svg viewBox="0 0 24 24"><path d="M4 7h11M4 12h11M4 17h7"/><path d="M17 14l4 3-4 3z"/></svg>
                Очередь
            </button>
        </nav>

        <div class="side__sep"></div>

        <div class="side__head">
            <span class="side__label">Плейлисты</span>
            <button class="iconbtn" id="btn-new-playlist" title="Новый плейлист">
                <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            </button>
        </div>

        <div class="side__list" id="side-playlists"></div>

        <div class="side__foot">
            <button class="btn btn--ghost" data-add style="width:100%">
                <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                Добавить файлы
            </button>
            <!-- Выбор папки есть только там, где браузер умеет запоминать
                 ссылки на неё. Кнопка прячется кодом, если не умеет. -->
            <button class="btn btn--ghost" data-folder id="btn-folder" hidden style="width:100%;margin-top:6px">
                <svg viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10H3z"/></svg>
                Указать папку
            </button>
        </div>
    </aside>

    <!-- ══ Содержимое ═══════════════════════════════════════════════ -->
    <main class="main panel">
        <!-- Верхняя полоса как у Спотифая: стрелки назад-вперёд слева,
             поле поиска появляется только на своём экране. -->
        <div class="topbar">
            <div class="topbar__nav">
                <button class="iconbtn" id="btn-back" title="Назад" disabled>
                    <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
                </button>
                <button class="iconbtn" id="btn-fwd" title="Вперёд" disabled>
                    <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
                </button>
            </div>
            <div class="search" id="searchbox" hidden>
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
                <input type="search" id="q" placeholder="Трек, исполнитель или альбом" autocomplete="off">
                <button class="iconbtn" id="q-clear" title="Очистить" hidden>
                    <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
                </button>
            </div>
            <div class="topbar__end">
                <button class="btn btn--sm" data-add>
                    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                    Добавить
                </button>
            </div>
        </div>

        <!-- Сюда экраны рисуются кодом: разметка у них разная и меняется,
             держать пять готовых кусков в HTML — только плодить рассинхрон. -->
        <div class="main__scroll" id="view"></div>
    </main>

    <!-- ══ Плеер ════════════════════════════════════════════════════
         На телефоне это узкая плашка (art + название + play + next).
         Тап по ней раскрывает те же самые элементы на весь экран —
         никакого второго набора controls: класс is-expanded просто
         меняет им раскладку через CSS. -->
    <footer class="player panel" id="player">
        <!-- Спектр. Рисуется под содержимым панели и не ловит клики.
             Для источников без анализа (SoundCloud) показывает
             спокойную волну вместо замершего нуля — иначе выглядит
             сломанным. -->
        <canvas class="viz" id="viz" aria-hidden="true"></canvas>

        <button class="player__close" id="btn-collapse" title="Свернуть">
            <svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>
        </button>

        <div class="np" id="np">
            <div class="np__art" id="np-art">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 18V5l10-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/>
                </svg>
            </div>
            <div class="np__text">
                <div class="np__title" id="np-title">Ничего не играет</div>
                <div class="np__artist" id="np-artist">—</div>
            </div>
        </div>

        <div class="transport">
            <div class="transport__btns">
                <button class="ctl" id="btn-shuffle" title="Вперемешку">
                    <svg viewBox="0 0 24 24"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6M4 4l5 5"/></svg>
                </button>
                <button class="ctl" id="btn-prev" title="Предыдущий">
                    <svg viewBox="0 0 24 24"><path d="M19 5v14l-11-7z" fill="currentColor" stroke="none"/><path d="M6 5v14"/></svg>
                </button>
                <button class="ctl ctl--play" id="btn-play" title="Играть">
                    <svg id="icon-play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>
                    <svg id="icon-pause" viewBox="0 0 24 24" hidden><path d="M7 4h4v16H7zM13 4h4v16h-4z"/></svg>
                </button>
                <button class="ctl" id="btn-next" title="Следующий">
                    <svg viewBox="0 0 24 24"><path d="M5 5v14l11-7z" fill="currentColor" stroke="none"/><path d="M18 5v14"/></svg>
                </button>
                <button class="ctl" id="btn-repeat" title="Повтор">
                    <svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4"/><path d="M3 12v-2a4 4 0 014-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 12v2a4 4 0 01-4 4H3"/></svg>
                </button>
            </div>
            <div class="seek">
                <span class="seek__t" id="t-cur">0:00</span>
                <div class="bar" id="seek" role="slider" aria-label="Перемотка" tabindex="0">
                    <div class="bar__track"><div class="bar__fill" id="seek-fill"></div></div>
                    <div class="bar__knob" id="seek-knob"></div>
                </div>
                <span class="seek__t" id="t-dur">0:00</span>
            </div>
        </div>

        <div class="extras">
            <button class="ctl" id="btn-queue" title="Очередь" data-go="queue">
                <svg viewBox="0 0 24 24"><path d="M4 7h11M4 12h11M4 17h7"/><path d="M17 14l4 3-4 3z"/></svg>
            </button>
            <button class="ctl" id="btn-mute" title="Звук">
                <svg viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 010 7"/><path d="M18.5 5.5a9 9 0 010 13"/></svg>
            </button>
            <div class="vol">
                <div class="bar" id="vol" role="slider" aria-label="Громкость" tabindex="0">
                    <div class="bar__track"><div class="bar__fill" id="vol-fill"></div></div>
                    <div class="bar__knob" id="vol-knob"></div>
                </div>
            </div>
        </div>

    </footer>

    <!-- Нижние вкладки — только на телефоне, боковой колонки там нет -->
    <nav class="tabs" id="tabs">
        <button class="tab" data-go="home">
            <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 9.5V20h14V9.5"/></svg>
            Главная
        </button>
        <button class="tab" data-go="search">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            Поиск
        </button>
        <button class="tab" data-go="library">
            <svg viewBox="0 0 24 24"><path d="M4 19V5M9 19V5M14 6l5 13"/></svg>
            Медиатека
        </button>
        <button class="tab" data-go="playlists">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h4"/></svg>
            Плейлисты
        </button>
    </nav>
</div>

<div class="toasts" id="toasts"></div>

<!-- Выбор файлов держим в разметке: программно созданный input в некоторых
     браузерах не считается «настоящим» кликом пользователя и молча не
     открывает окно выбора. -->
<input type="file" id="file-input" accept="audio/*,.mp3,.m4a,.flac,.ogg,.opus,.wav,.aac" multiple hidden>

<script>window.kiwiStep && kiwiStep("разметка загружена")</script>
<script type="module" src="assets/js/app.js"></script>
</body>
</html>
